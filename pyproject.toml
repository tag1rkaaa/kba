[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kba"
version = "0.1.0"
description = "Knowledge Base Application"
requires-python = ">=3.11"

dependencies = [
    "fastapi[standard]>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "python-multipart>=0.0.9",
    "celery[redis]>=5.3",
    "structlog>=24.0",
    "pgvector>=0.3",
    "minio>=7.0",
    "cryptography>=42.0",
    "psycopg2-binary>=2.9",
    "sentence-transformers>=2.7",
    "torch",
]

[project.optional-dependencies]
ml = ["sentence-transformers>=2.7", "torch"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "factory-boy>=3.3",
    "ruff>=0.4",
    "mypy>=1.10",
    "black>=24.0",
]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff.lint]
ignore = [
    "B008",   # Depends() в аргументах — стандарт FastAPI
    "DTZ003", # datetime.utcnow()
    "BLE001", # broad exception catch
    "E501",   # длина строки
    "RUF001", # кириллица в строках
    "RUF002", # кириллица в docstring
    "RUF003", # кириллица в комментариях
]
select = ["E", "F", "I", "UP", "RUF"]
